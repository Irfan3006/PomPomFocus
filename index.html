<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomPomFocus - Cute Pomodoro Timer</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="header text-center py-3" data-aos="fade-down">
            <div class="container">
                <h1 class="app-title">
                    <i class="bi bi-alarm-fill text-primary"></i>
                    PomPomFocus
                </h1>
                <p class="subtitle mb-0">Your cute productivity companion 🐰</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Time Display -->
                <div class="time-display-container" data-aos="fade-up">
                    <div class="current-time" id="currentTime"></div>
                </div>

                <!-- Timer Section -->
                <section class="timer-section" data-aos="zoom-in">
                    <div class="timer-card">
                        <!-- Mode Indicator -->
                        <div class="mode-indicator">
                            <span class="mode-badge" id="modeBadge">
                                <i class="bi bi-laptop"></i> Work Time
                            </span>
                        </div>

                        <!-- Timer Display -->
                        <div class="timer-display">
                            <div class="timer-circle">
                                <svg class="progress-ring" width="250" height="250">
                                    <circle class="progress-ring-bg" cx="125" cy="125" r="110" />
                                    <circle class="progress-ring-fill" id="progressRing" cx="125" cy="125" r="110" />
                                </svg>
                                <div class="timer-text">
                                    <div class="time-display" id="timerDisplay">25:00</div>
                                    <div class="motivational-message" id="motivationalMessage">Ready to focus? 🌟</div>
                                </div>
                            </div>
                        </div>

                        <!-- Control Buttons -->
                        <div class="timer-controls">
                            <button class="btn btn-primary btn-lg control-btn" id="startBtn">
                                <i class="bi bi-play-fill"></i> Start
                            </button>
                            <button class="btn btn-warning btn-lg control-btn" id="pauseBtn" style="display: none;">
                                <i class="bi bi-pause-fill"></i> Pause
                            </button>
                            <button class="btn btn-danger btn-lg control-btn" id="resetBtn">
                                <i class="bi bi-arrow-clockwise"></i> Reset
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Timer Settings -->
                <section class="settings-section" data-aos="fade-up" data-aos-delay="100">
                    <div class="settings-card">
                        <h3 class="settings-title">
                            <i class="bi bi-gear-fill"></i> Timer Settings
                        </h3>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Work Duration</label>
                                <select class="form-select" id="workDuration">
                                    <option value="25">25 minutes</option>
                                    <option value="50">50 minutes</option>
                                    <option value="75">75 minutes</option>
                                    <option value="100">100 minutes</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Break Duration</label>
                                <select class="form-select" id="breakDuration">
                                    <option value="5">5 minutes</option>
                                    <option value="10">10 minutes</option>
                                    <option value="15">15 minutes</option>
                                    <option value="20">20 minutes</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">Volume</label>
                            <input type="range" class="form-range" id="volumeControl" min="0" max="100" value="50">
                            <small class="text-muted">Volume: <span id="volumeValue">50%</span></small>
                        </div>
                    </div>
                </section>

                <!-- Statistics Section -->
                <section class="stats-section" data-aos="fade-up" data-aos-delay="200">
                    <div class="stats-card">
                        <h3 class="stats-title">
                            <i class="bi bi-graph-up"></i> Your Progress
                        </h3>
                        
                        <div class="row g-3 text-center">
                            <div class="col-6 col-md-3">
                                <div class="stat-item">
                                    <div class="stat-number" id="totalSessions">0</div>
                                    <div class="stat-label">Total Sessions</div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="stat-item">
                                    <div class="stat-number" id="totalFocusTime">0h 0m</div>
                                    <div class="stat-label">Focus Time</div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="stat-item">
                                    <div class="stat-number" id="todaySessions">0</div>
                                    <div class="stat-label">Today</div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="stat-item">
                                    <div class="stat-number" id="currentStreak">0</div>
                                    <div class="stat-label">Day Streak</div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3 text-center">
                            <button class="btn btn-sm btn-outline-danger" id="clearDataBtn">
                                <i class="bi bi-trash"></i> Clear All Data
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer text-center py-3">
            <div class="container">
                <div class="theme-toggle">
                    <button class="btn btn-outline-primary btn-sm" id="themeToggle">
                        <i class="bi bi-palette-fill"></i> Pink Mode
                    </button>
                </div>
                <p class="mb-0">Made with 💕 for productivity</p>
            </div>
        </footer>
    </div>

    <!-- Audio Elements -->
    <audio id="startSound" preload="auto"></audio>
    <audio id="completeSound" preload="auto"></audio>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
