<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomPomFocus - Minimalist Cute Pomodoro Timer</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Minimal Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🐰</span>
                    <span class="logo-text">PomPomFocus</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                        <i class="bi bi-palette-fill"></i>
                    </button>
                    <button class="icon-btn" id="settingsBtn" title="Settings">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Timer Section -->
                <section class="timer-section">
                    <div class="timer-card">
                        <!-- Mode Selector -->
                        <div class="mode-selector">
                            <button class="mode-btn active" id="workMode" data-mode="work">
                                <i class="bi bi-laptop"></i>
                                Focus
                            </button>
                            <button class="mode-btn" id="breakMode" data-mode="break">
                                <i class="bi bi-cup-hot"></i>
                                Break
                            </button>
                        </div>

                        <!-- Timer Display -->
                        <div class="timer-display">
                            <div class="timer-circle">
                                <svg class="progress-ring" width="240" height="240">
                                    <circle class="progress-ring-bg" cx="120" cy="120" r="110" />
                                    <circle class="progress-ring-fill" id="progressRing" cx="120" cy="120" r="110" />
                                </svg>
                                <div class="timer-text">
                                    <div class="time-display" id="timerDisplay">25:00</div>
                                    <div class="session-info">
                                        <span class="session-label">Session</span>
                                        <span class="session-number" id="sessionNumber">1</span>
                                    </div>
                                    <div class="motivational-message" id="motivationalMessage">Ready to focus? 🌟</div>
                                </div>
                            </div>
                        </div>

                        <!-- Quick Settings -->
                        <div class="quick-settings">
                            <div class="duration-options">
                                <button class="duration-btn active" data-minutes="25">25m</button>
                                <button class="duration-btn" data-minutes="50">50m</button>
                                <button class="duration-btn" data-minutes="75">75m</button>
                                <button class="duration-btn" data-minutes="100">100m</button>
                            </div>
                        </div>

                        <!-- Control Buttons -->
                        <div class="timer-controls">
                            <button class="btn-control btn-secondary" id="resetBtn">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                            <button class="btn-control btn-primary" id="startBtn">
                                <i class="bi bi-play-fill"></i>
                            </button>
                            <button class="btn-control btn-primary" id="pauseBtn" style="display: none;">
                                <i class="bi bi-pause-fill"></i>
                            </button>
                            <button class="btn-control btn-secondary" id="skipBtn">
                                <i class="bi bi-skip-forward-fill"></i>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Stats Section -->
                <section class="stats-section">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-check-circle"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalSessions">0</div>
                                <div class="stat-label">Sessions</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-clock-history"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalFocusTime">0h</div>
                                <div class="stat-label">Focus Time</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-fire"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="currentStreak">0</div>
                                <div class="stat-label">Streak</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="bi bi-calendar-check"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="todaySessions">0</div>
                                <div class="stat-label">Today</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Settings Panel -->
                <section class="settings-panel" id="settingsPanel" style="display: none;">
                    <div class="settings-card">
                        <div class="settings-header">
                            <h3>Settings</h3>
                            <button class="close-btn" id="closeSettings">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        
                        <div class="settings-content">
                            <!-- Timer Settings -->
                            <div class="setting-group">
                                <label class="setting-label">Focus Duration</label>
                                <div class="setting-options">
                                    <button class="option-btn" data-minutes="25">25</button>
                                    <button class="option-btn" data-minutes="50">50</button>
                                    <button class="option-btn" data-minutes="75">75</button>
                                    <button class="option-btn" data-minutes="100">100</button>
                                </div>
                            </div>

                            <div class="setting-group">
                                <label class="setting-label">Break Duration</label>
                                <div class="setting-options">
                                    <button class="option-btn" data-minutes="5">5</button>
                                    <button class="option-btn" data-minutes="10">10</button>
                                    <button class="option-btn" data-minutes="15">15</button>
                                    <button class="option-btn" data-minutes="20">20</button>
                                </div>
                            </div>

                            <!-- Volume Control -->
                            <div class="setting-group">
                                <label class="setting-label">Volume</label>
                                <div class="volume-control">
                                    <input type="range" class="volume-slider" id="volumeControl" min="0" max="100" value="50">
                                    <span class="volume-value" id="volumeValue">50%</span>
                                </div>
                            </div>

                            <!-- Toggles -->
                            <div class="setting-group">
                                <div class="setting-toggle">
                                    <label class="toggle-label">Auto-start Breaks</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="autoStartToggle" checked>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>

                            <div class="setting-group">
                                <div class="setting-toggle">
                                    <label class="toggle-label">Browser Notifications</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="notificationToggle" checked>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="setting-group">
                                <div class="setting-actions">
                                    <button class="btn-outline btn-small" id="exportDataBtn">
                                        <i class="bi bi-download"></i> Export Data
                                    </button>
                                    <button class="btn-outline btn-small btn-danger" id="clearDataBtn">
                                        <i class="bi bi-trash"></i> Clear Data
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <span>Made with 💕 for productivity</span>
            </div>
        </footer>
    </div>

    <!-- Audio Elements -->
    <audio id="startSound" preload="auto"></audio>
    <audio id="completeSound" preload="auto"></audio>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
